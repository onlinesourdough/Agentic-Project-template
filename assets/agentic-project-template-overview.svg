<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Project Template workflow</title>
  <desc id="desc">Resolved context moves through project-local specification, building, review, and owned operation, with measured learning returning upstream.</desc>
  <rect width="1600" height="760" rx="42" fill="#f3efe6"/>
  <text x="88" y="84" fill="#756f62" font-family="ui-monospace,monospace" font-size="22" letter-spacing="3">ONLINESOURDOUGH · AGENTIC PROJECT TEMPLATE</text>
  <text x="88" y="174" fill="#25241f" font-family="ui-sans-serif,system-ui" font-size="62" font-weight="750" letter-spacing="-3">From a useful brief to an owned bake.</text>
  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(88 254)"><rect width="270" height="236" rx="28" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">INPUT</text><text x="28" y="99" fill="#25241f" font-size="29" font-weight="700">Resolved context</text><text x="28" y="138" fill="#666257" font-size="18">AIOS need</text><text x="28" y="168" fill="#666257" font-size="17">Optional design handoff</text><text x="28" y="198" fill="#666257" font-size="18">Existing project truth</text></g>
    <g transform="translate(425 254)"><rect width="235" height="236" rx="28" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">SPEC</text><text x="28" y="99" fill="#25241f" font-size="29" font-weight="700">Choose the bake</text><text x="28" y="138" fill="#666257" font-size="18">Boundary, owner,</text><text x="28" y="168" fill="#666257" font-size="18">proof and stack.</text></g>
    <g transform="translate(727 254)"><rect width="235" height="236" rx="28" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">BUILD ↔ REVIEW</text><text x="28" y="99" fill="#25241f" font-size="29" font-weight="700">Make and taste</text><text x="28" y="138" fill="#666257" font-size="18">Small result, real</text><text x="28" y="168" fill="#666257" font-size="18">interface, evidence.</text></g>
    <g transform="translate(1029 254)"><rect width="235" height="236" rx="28" fill="#fffdf8" stroke="#d8d1c3" stroke-width="2"/><text x="28" y="48" fill="#e4572e" font-size="18" font-weight="700">SHIP</text><text x="28" y="99" fill="#25241f" font-size="29" font-weight="700">Serve safely</text><text x="28" y="138" fill="#666257" font-size="18">Authorized delivery</text><text x="28" y="168" fill="#666257" font-size="18">with recovery.</text></g>
    <g transform="translate(1331 254)"><rect width="181" height="236" rx="28" fill="#2f5d50"/><text x="24" y="48" fill="#f3c98b" font-size="18" font-weight="700">OWNER</text><text x="24" y="99" fill="#ffffff" font-size="27" font-weight="700">Operate</text><text x="24" y="132" fill="#ffffff" font-size="27" font-weight="700">and learn</text><text x="24" y="174" fill="#dfeae5" font-size="17">Independent</text><text x="24" y="201" fill="#dfeae5" font-size="17">lifecycle.</text></g>
  </g>
  <g fill="none" stroke="#e4572e" stroke-width="4" stroke-linecap="round"><path d="M359 372H414"/><path d="M661 372H716"/><path d="M963 372H1018"/><path d="M1265 372H1320"/></g>
  <g fill="#e4572e"><path d="m414 372-13-8v16z"/><path d="m716 372-13-8v16z"/><path d="m1018 372-13-8v16z"/><path d="m1320 372-13-8v16z"/></g>
  <text x="88" y="574" fill="#2f5d50" font-family="ui-sans-serif,system-ui" font-size="22" font-weight="700">Measured learning returns to AIOS</text>
  <path d="M1420 514V620H520" fill="none" stroke="#2f5d50" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 10"/>
  <path d="m520 620 14-9v18z" fill="#2f5d50"/>
  <text x="88" y="702" fill="#756f62" font-family="ui-sans-serif,system-ui" font-size="20">One Project. One owner. No inherited template state.</text>
</svg>
