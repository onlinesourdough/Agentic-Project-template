<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From a business need to an owned solution</title>
  <desc id="desc">A connected flow moves from a business need to a required capability, through the Solution-template foundation and Build, Buy, Rent, or Integrate choices, into an owned application, service, automation, or integration. Operation, proof, and learning feed the next business need.</desc>

  <rect width="1600" height="900" rx="36" fill="#f4f1e9"/>
  <rect x="38" y="38" width="1524" height="824" rx="30" fill="#fbfaf6" stroke="#d8d2c4" stroke-width="2"/>

  <!-- Header -->
  <text x="800" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="700" fill="#263b36">From need to owned solution</text>
  <text x="800" y="126" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#6c6a63">A small foundation for choosing, building and operating only what the business needs.</text>

  <!-- Main directional line -->
  <path d="M256 372H348 M554 372H642 M958 372H1045 M1281 372H1368" fill="none" stroke="#668d82" stroke-width="4" stroke-linecap="round"/>
  <path d="M336 364L350 372L336 380Z M630 364L644 372L630 380Z M1033 364L1047 372L1033 380Z M1356 364L1370 372L1356 380Z" fill="#668d82"/>

  <!-- Business need -->
  <rect x="76" y="262" width="180" height="220" rx="26" fill="#e8e3d7" stroke="#c8bdab" stroke-width="2"/>
  <circle cx="166" cy="320" r="32" fill="#d49357"/>
  <path d="M148 323C158 304 177 304 186 323M151 327H183M157 335H177" fill="none" stroke="#fffaf0" stroke-width="4" stroke-linecap="round"/>
  <text x="166" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#30322f">Business need</text>
  <text x="166" y="414" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6c6a63">A result, constraint</text>
  <text x="166" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6c6a63">or opportunity</text>

  <!-- Capability -->
  <rect x="350" y="262" width="204" height="220" rx="26" fill="#dce9e4" stroke="#b8d0c8" stroke-width="2"/>
  <circle cx="452" cy="320" r="32" fill="#668d82"/>
  <path d="M434 320H470M452 302V338M440 308L464 332M464 308L440 332" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <circle cx="452" cy="320" r="9" fill="#668d82" stroke="#ffffff" stroke-width="3"/>
  <text x="452" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#263b36">Capability</text>
  <text x="452" y="414" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#5e6d68">What must be</text>
  <text x="452" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#5e6d68">possible?</text>

  <!-- Foundation -->
  <rect x="644" y="218" width="314" height="308" rx="34" fill="#263b36"/>
  <circle cx="801" cy="306" r="54" fill="#f3eee2"/>
  <path d="M768 321C780 295 823 295 834 321C825 329 814 333 801 333C788 333 777 329 768 321Z" fill="#d49357"/>
  <path d="M778 313C785 307 793 304 801 304C810 304 819 307 826 313M787 320L794 311M802 321V306M817 320L809 311" fill="none" stroke="#fffaf0" stroke-width="3" stroke-linecap="round"/>
  <text x="801" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#ffffff">Solution-template</text>
  <text x="801" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#c4d9d3">foundation</text>

  <rect x="680" y="455" width="61" height="38" rx="12" fill="#d49357"/>
  <rect x="750" y="455" width="61" height="38" rx="12" fill="#7797b0"/>
  <rect x="820" y="455" width="61" height="38" rx="12" fill="#8ea083"/>
  <rect x="890" y="455" width="32" height="38" rx="12" fill="#a99eb8"/>
  <text x="710" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Build</text>
  <text x="780" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Buy</text>
  <text x="850" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Rent</text>
  <text x="906" y="480" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#ffffff">+</text>
  <text x="801" y="514" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#c4d9d3">Integrate when that makes the smallest complete result.</text>

  <!-- Owned solution -->
  <rect x="1047" y="238" width="234" height="268" rx="28" fill="#e6e3ed" stroke="#c9c2d4" stroke-width="2"/>
  <circle cx="1164" cy="306" r="40" fill="#7b708d"/>
  <path d="M1141 294L1164 281L1187 294V320L1164 333L1141 320Z M1152 300L1164 293L1176 300V314L1164 321L1152 314Z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <text x="1164" y="378" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="700" fill="#40384e">Owned solution</text>
  <text x="1164" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6a6275">app • service</text>
  <text x="1164" y="431" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#6a6275">automation • integration</text>
  <text x="1164" y="467" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6a6275">The instantiated project,</text>
  <text x="1164" y="486" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#6a6275">not the template itself.</text>

  <!-- Operate and learn -->
  <rect x="1370" y="262" width="154" height="220" rx="26" fill="#e8eee1" stroke="#c8d3bc" stroke-width="2"/>
  <circle cx="1447" cy="320" r="32" fill="#788f6b"/>
  <path d="M1429 321L1441 333L1466 305" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1447" y="382" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700" fill="#3c4c34">Operate</text>
  <text x="1447" y="409" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#687361">Proof + learning</text>
  <text x="1447" y="432" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#687361">feeds what comes next</text>

  <!-- Feedback loop -->
  <path d="M1447 482V590C1447 646 1400 680 1342 680H210C150 680 116 640 116 586V482" fill="none" stroke="#d49357" stroke-width="3" stroke-linecap="round" stroke-dasharray="9 10"/>
  <path d="M108 498L116 484L124 498Z" fill="#d49357"/>
  <text x="800" y="704" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#8b6848">Measured learning sharpens the next need.</text>

  <!-- Continuum -->
  <text x="190" y="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#6c6a63">GENERIC</text>
  <path d="M260 766H1328" fill="none" stroke="#a8a49a" stroke-width="2" stroke-linecap="round"/>
  <path d="M1316 758L1332 766L1316 774Z" fill="#a8a49a"/>
  <circle cx="452" cy="766" r="7" fill="#668d82"/>
  <circle cx="801" cy="766" r="7" fill="#263b36"/>
  <circle cx="1164" cy="766" r="7" fill="#7b708d"/>
  <text x="1360" y="770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#6c6a63">ORGANIZATION-SPECIFIC</text>

  <text x="800" y="824" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" fill="#6c6a63">From useful ingredient to a bake the business can own.</text>
</svg>
