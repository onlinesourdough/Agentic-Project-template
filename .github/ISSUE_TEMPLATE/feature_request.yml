name: Feature request
description: Propose a change tied to a repeated technical need.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Technical problem
      description: Describe the responsibility or boundary the current template does not protect.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and current workaround
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Likely scope
      options:
        - application
        - service
        - automation
        - integration
        - system
        - static-pages
        - cloudflare-native
        - convex
        - external
        - applicator
        - workflow
    validations:
      required: true
